{% extends 'clinic/base.html' %}

{% block title %}Изменение профиля | Clinic{% endblock %}

{% block content %}

<section class="edit-profile-section">

    <form method="POST" class="edit-profile-form">
        {% csrf_token %}

        <h1 class="form-title">Изменить профиль</h1>

        <div class="form-group">
            <label class="form-label">Имя пользователя</label>
            <input type="text" name="username" value="{{ user.username }}" class="form-input" required>
        </div>

        <div class="form-group">
            <label class="form-label">Электронная почта</label>
            <input type="email" name="email" value="{{ user.email }}" class="form-input" required>
        </div>

        <button type="submit" class="submit-btn">Сохранить изменения</button>

        <a href="{% url 'profile' %}" class="back-button">Назад</a>

    </form>

</section>

{% endblock %}
