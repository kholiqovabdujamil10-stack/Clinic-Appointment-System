{% extends 'clinic/base.html' %}

{% block title %}Изменить информацию | Clinic{% endblock %}

{% block content %}

<section class="edit-doctor-section">

    <form method="POST" enctype="multipart/form-data" class="edit-doctor-form">
        {% csrf_token %}

        <h1 class="form-title">Изменить информацию о враче</h1>

        <div class="form-group">
            <label class="form-label">Имя врача</label>
            <input type="text" name="name" value="{{ doctor.name }}" class="form-input" required>
        </div>

        <div class="form-group">
            <label class="form-label">Специализация</label>

            <select name="specialization" class="form-select" required>
                {% for specialization in specializations %}
                <option value="{{ specialization.id }}">
                    {{ specialization.name }}
                </option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label class="form-label">Опыт работы (лет)</label>
            <input type="number" name="experience" value="{{ doctor.experience }}" class="form-input" min="0" required>
        </div>

        <div class="form-group">
            <label class="form-label">Описание</label>
            <textarea name="description" class="form-textarea" required>{{ doctor.description }}</textarea>
        </div>

        <div class="form-group">
            <label class="form-label">Фотография врача</label>
            <img src="{{ doctor.image.url }}" alt="{{ doctor.name }}" class="current-doctor-image">
            <input type="file" name="image" class="form-input">
        </div>

        <button type="submit" class="submit-btn">Сохранить изменения</button>

        <a href="{% url 'doctor_profile' %}" class="back-button">Назад</a>

    </form>

</section>

{% endblock %}
