{% extends 'clinic/base.html' %}

{% block title %}Вход | Clinic{% endblock %}

{% block content %}

<div class="auth-container">

    <form method="POST" class="auth-form">
        {% csrf_token %}

        <h1 class="form-title">Вход в аккаунт</h1>

        <div class="form-group">
            <label class="form-label">Имя пользователя</label>
            <input type="text" name="username" class="form-input" placeholder="Введите имя пользователя" required>
        </div>

        <div class="form-group">
            <label class="form-label">Пароль</label>
            <input type="password" name="password" class="form-input" placeholder="Введите пароль" required>
        </div>

        <button type="submit" class="submit-btn">Войти</button>

        <p class="form-text">
            Нет аккаунта?
            <a href="{% url 'registration' %}" class="form-link">Зарегистрироваться</a>
        </p>

    </form>

</div>

{% endblock %}
